spring.application.name=microsservicosimulaoprocessamento
server.port=8080

spring.datasource.url=jdbc:h2:mem:pixdb
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

app.security.user=${APP_SECURITY_USER}
app.security.pass=${APP_SECURITY_PASS}

spring.cloud.aws.region.static=${AWS_REGION:us-east-1}
aws.sns.pix-topic-arn=${AWS_SNS_PIX_TOPIC_ARN}
aws.sqs.pix-queue-name=${AWS_SQS_PIX_QUEUE_NAME}
aws.sns.endpoint=${AWS_SNS_ENDPOINT:}
